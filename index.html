<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>固定号码通话</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #111; color: #eee;
    font: 16px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  #app { min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #stage { position: relative; height: 32vh; background: #000; }
  #remote { width: 100%; height: 100%; object-fit: cover; background: #000; }
  #local { position: absolute; right: 10px; top: 10px; width: 72px; height: 96px; object-fit: cover;
    border-radius: 10px; background: #222; border: 1px solid #444; transform: scaleX(-1); }
  #tap { position: absolute; inset: 0; margin: auto; width: 160px; height: 52px; border: 0;
    border-radius: 26px; background: #0a84ff; color: #fff; font-size: 17px; }
  #status { padding: 10px 14px; font-size: 14px; color: #ddd; background: #1b1b1b; min-height: 42px; }
  #panel { padding: 14px; display: flex; flex-direction: column; gap: 16px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 10px; }
  .t { font-size: 14px; color: #bbb; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 1px;
    border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; }
  button { flex: 1; padding: 13px 8px; font-size: 17px; border: 0; border-radius: 10px; color: #fff; background: #0a84ff; cursor: pointer; }
  button.green { background: #30d158; }
  button.red { background: #ff453a; }
  button.gray { background: #3a3a3c; }
  #badge { font-size: 14px; color: #888; }
  #badge.on { color: #30d158; }
  #incoming { background: #1f2a44; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  #inText { font-size: 20px; text-align: center; }

  /* 聊天与图片区域样式 */
  #chatSec { background: #18181a; border: 1px solid #2c2c2e; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #chatHeader { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #aaa; }
  #btnClearChat { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; border-radius: 6px; background: #2c2c2e; color: #bbb; }
  #chatBox { height: 210px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px; background: #111; border-radius: 8px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .msg.me { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.peer { align-self: flex-start; background: #2c2c2e; color: #eee; border-bottom-left-radius: 4px; }
  .msg-meta { font-size: 11px; opacity: 0.75; margin-bottom: 3px; }
  .msg-img { display: block; max-width: 220px; max-height: 220px; width: auto; height: auto; border-radius: 8px; margin-top: 4px; cursor: pointer; }
  #btnImg { flex: 0 0 auto; padding: 10px 12px; font-size: 15px; background: #3a3a3c; }
  #chatInput { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; text-align: left; letter-spacing: 0; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; }
  #btnSend { flex: 0 0 76px; padding: 10px 8px; font-size: 16px; }

  /* 图片灯箱预览 */
  #imgModal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 999;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  #imgModal img { max-width: 100%; max-height: 88vh; border-radius: 8px; object-fit: contain; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <button id="tap" hidden>点击播放</button>
  </div>
  <div id="status">正在加载…</div>

  <div id="panel">
    <div id="sMe" class="sec">
      <div class="t">我的号码（固定，保存在本机；别人拨这个号码找你）</div>
      <div class="row">
        <input id="myCode" type="text" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="3～20 位字母或数字">
        <button id="btnOnline" class="gray" style="flex:0 0 96px">上线</button>
      </div>
      <div id="badge">○ 离线</div>
    </div>

    <div id="sDial" class="sec" hidden>
      <div class="t">对方号码（会记住上次拨打的号码）</div>
      <input id="peerCode" type="text" maxlength="20" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="对方的固定号码">
      <div class="row">
        <button id="btnVoice" class="green">语音通话</button>
        <button id="btnVideo">视频通话</button>
      </div>
    </div>

    <div id="incoming" hidden>
      <div id="inText"></div>
      <div class="row">
        <button id="btnAccept" class="green">接听</button>
        <button id="btnReject" class="red">拒绝</button>
      </div>
    </div>

    <div id="ctrl" class="row" hidden>
      <button id="btnMute" class="gray">静音</button>
      <button id="btnCam" class="gray">关摄像头</button>
      <button id="btnHang" class="red">挂断</button>
    </div>

    <!-- 文字与图片消息区域：上线后随时可发，通话中也可用 -->
    <div id="chatSec" hidden>
      <div id="chatHeader">
        <span id="chatTitle">消息（直连传输，图片自动压缩适配）</span>
        <button id="btnClearChat" type="button">清空</button>
      </div>
      <div id="chatBox"></div>
      <div class="row">
        <input id="imgPicker" type="file" accept="image/*" hidden>
        <button id="btnImg" type="button">图片</button>
        <input id="chatInput" type="text" maxlength="1000" placeholder="输入消息发给对方…">
        <button id="btnSend" type="button">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 点击消息里的图片放大查看 -->
<div id="imgModal" hidden>
  <img id="imgModalSrc" alt="图片预览">
</div>

<script>
// ===== 配置 =====
const METERED_APP = 'yangyyg'; // 对应 yangyyg.metered.live
const METERED_TURN_API_KEY = 'i5wjPHxYv2B5xctgnJsQJnDHlLfvl_w2_l9eEMIjtseV7YPk';
const MAX_IMG_RAW_BYTES = 15 * 1024 * 1024; // 限制单张原始图片最大 15MB
const MAX_IMG_SIDE = 800;                    // 压缩后最长边不超过 800px，降低 DataChannel 传输失败概率
const IMG_JPEG_QUALITY = 0.62;               // 压缩质量

const RTC_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun.miwifi.com:3478' },
  ],
};

async function loadTurnCredentials() {
  if (!METERED_APP || METERED_APP === '你的应用名' ||
      !METERED_TURN_API_KEY || METERED_TURN_API_KEY === '粘贴你的TURN凭据API_KEY') {
    setStatus('STUN 已加载；尚未填写 Metered TURN API Key，严格 NAT 网络可能无法通话');
    return false;
  }
  try {
    const endpoint = `https://${METERED_APP}.metered.live/api/v1/turn/credentials?apiKey=${encodeURIComponent(METERED_TURN_API_KEY)}`;
    const response = await fetch(endpoint);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const servers = await response.json();
    if (!Array.isArray(servers) || !servers.some(x => String(x.urls || '').startsWith('turn'))) {
      throw new Error('服务器没有返回 TURN 配置');
    }
    RTC_CONFIG.iceServers.push(...servers);
    setStatus('STUN/TURN 配置已加载，可以上线');
    return true;
  } catch (e) {
    setStatus('TURN 凭据获取失败：' + (e.message || e) + '；目前仅使用 STUN');
    return false;
  }
}

const PREFIX = 'wrtc-';
const PEERJS_URLS = [
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
];
const q = new URLSearchParams(location.search);
const PEER_OPTS = { debug: 1, config: RTC_CONFIG };
if (q.get('host')) {
  PEER_OPTS.host = q.get('host');
  PEER_OPTS.port = Number(q.get('port')) || 443;
  PEER_OPTS.path = q.get('path') || '/';
  PEER_OPTS.secure = q.get('secure') !== '0';
}
const RING_MS = Number(q.get('ring')) || 40000;

const $ = (id) => document.getElementById(id);
let peer = null, online = false, call = null, incoming = null, ctrlConn = null;
let chatConns = {};
let localStream = null, wakeLock = null, ringTimer = null, inTimer = null;
let durationTimer = null, callStartTime = 0;
let PeerCtor = null;

const setStatus = (t) => { $('status').textContent = t; };
const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const validCode = (c) => /^[A-Za-z0-9]{3,20}$/.test(c);

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function startDurationTimer() {
  stopDurationTimer();
  callStartTime = Date.now();
  setStatus('通话中 00:00（请保持本页面在前台）');
  durationTimer = setInterval(() => {
    if (!call) return stopDurationTimer();
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    setStatus(`通话中 ${formatDuration(elapsed)}（请保持本页面在前台）`);
  }, 1000);
}

function stopDurationTimer() {
  if (durationTimer) {
    clearInterval(durationTimer);
    durationTimer = null;
  }
}

function render() {
  $('badge').textContent = online ? '● 在线' : '○ 离线';
  $('badge').className = online ? 'on' : '';
  $('sMe').hidden = !!call || !!incoming;
  $('sDial').hidden = !online || !!call || !!incoming;
  $('incoming').hidden = !incoming;
  $('ctrl').hidden = !call;
  $('chatSec').hidden = !online;
}

function clearCallTimers() {
  if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
  if (inTimer) { clearTimeout(inTimer); inTimer = null; }
  stopDurationTimer();
}

function closeCtrlConn() {
  if (ctrlConn) {
    try { ctrlConn.close(); } catch (e) {}
    ctrlConn = null;
  }
}

function cleanupCall(msg, isError = false) {
  const finalDuration = callStartTime ? formatDuration(Math.floor((Date.now() - callStartTime) / 1000)) : '';
  callStartTime = 0;
  clearCallTimers();
  const c = call;
  call = null;
  if (c) {
    try { c.close(); } catch (e) {}
  }
  closeCtrlConn();
  stopMedia();
  render();
  if (msg) {
    const suffix = (!isError && finalDuration) ? `（时长 ${finalDuration}）` : '';
    setStatus(isError ? '出错：' + msg : msg + suffix);
  }
}

// ===== 文字与图片消息渲染、压缩与收发 =====
function nowTimeStr() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function openImagePreview(src) {
  if (!src) return;
  $('imgModalSrc').src = src;
  $('imgModal').hidden = false;
}

function closeImagePreview() {
  $('imgModal').hidden = true;
  $('imgModalSrc').src = '';
}

function appendChatMessage(senderLabel, payload, isMe) {
  const box = $('chatBox');
  const item = document.createElement('div');
  item.className = 'msg ' + (isMe ? 'me' : 'peer');

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.textContent = `${senderLabel} · ${nowTimeStr()}`;
  item.appendChild(meta);

  if (payload && payload.kind === 'image' && typeof payload.dataUrl === 'string') {
    const img = document.createElement('img');
    img.className = 'msg-img';
    img.src = payload.dataUrl;
    img.alt = payload.name || '图片消息';
    img.onclick = () => openImagePreview(payload.dataUrl);
    item.appendChild(img);
  } else if (payload && typeof payload.text === 'string') {
    const body = document.createElement('div');
    body.textContent = payload.text;
    item.appendChild(body);
  }

  box.appendChild(item);
  box.scrollTop = box.scrollHeight;
}

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) {
      return reject(new Error('请选择图片文件'));
    }
    if (file.size > MAX_IMG_RAW_BYTES) {
      return reject(new Error('图片太大（超过 15MB）'));
    }

    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > MAX_IMG_SIDE || height > MAX_IMG_SIDE) {
          if (width >= height) {
            height = Math.round((height * MAX_IMG_SIDE) / width);
            width = MAX_IMG_SIDE;
          } else {
            width = Math.round((width * MAX_IMG_SIDE) / height);
            height = MAX_IMG_SIDE;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, width);
        canvas.height = Math.max(1, height);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg', IMG_JPEG_QUALITY);

        resolve({
          kind: 'image',
          name: file.name || 'image.jpg',
          dataUrl,
        });
      };
      img.onerror = () => reject(new Error('图片解析失败'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('读取图片文件失败'));
    reader.readAsDataURL(file);
  });
}

function bindDataConnection(conn) {
  if (!conn || !conn.peer) return;
  chatConns[conn.peer] = conn;

  conn.on('data', (data) => {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'chat' && typeof data.text === 'string') {
      const fromCode = String(conn.peer).replace(PREFIX, '');
      if (!call && !incoming && !$('peerCode').value.trim()) {
        $('peerCode').value = fromCode;
        store.set('peerCode', fromCode);
      }
      appendChatMessage(fromCode, { kind: 'text', text: data.text }, false);
      if (!call && !incoming) {
        setStatus(`收到来自 ${fromCode} 的新消息`);
      }
    } else if (data.type === 'image' && typeof data.dataUrl === 'string' && data.dataUrl.startsWith('data:image/')) {
      const fromCode = String(conn.peer).replace(PREFIX, '');
      if (!call && !incoming && !$('peerCode').value.trim()) {
        $('peerCode').value = fromCode;
        store.set('peerCode', fromCode);
      }
      appendChatMessage(fromCode, { kind: 'image', dataUrl: data.dataUrl, name: data.name || '图片' }, false);
      if (!call && !incoming) {
        setStatus(`收到来自 ${fromCode} 的图片`);
      }
    } else if (data.type === 'reject' && call && call.peer === conn.peer) {
      cleanupCall('对方已拒绝来电');
    } else if (data.type === 'busy' && call && call.peer === conn.peer) {
      cleanupCall('对方正在通话中');
    } else if (data.type === 'cancel' && incoming && incoming.peer === conn.peer) {
      clearCallTimers();
      const inc = incoming;
      incoming = null;
      try { inc.close(); } catch (e) {}
      render();
      setStatus('对方已取消呼叫');
    }
  });

  conn.on('close', () => {
    if (chatConns[conn.peer] === conn) {
      delete chatConns[conn.peer];
    }
  });

  conn.on('error', () => {
    if (chatConns[conn.peer] === conn) {
      delete chatConns[conn.peer];
    }
  });
}

function getActiveTargetCode() {
  if (call && call.peer) return String(call.peer).replace(PREFIX, '');
  if (incoming && incoming.peer) return String(incoming.peer).replace(PREFIX, '');
  return $('peerCode').value.trim();
}

function dispatchPayload(targetCode, fullTarget, payload, uiPayload) {
  const existing = chatConns[fullTarget];
  if (existing && existing.open) {
    try {
      existing.send(payload);
      appendChatMessage('我 -> ' + targetCode, uiPayload, true);
      if (payload.type === 'image') setStatus('图片已发送给 ' + targetCode);
      return;
    } catch (e) {
      delete chatConns[fullTarget];
    }
  }

  try {
    const conn = peer.connect(fullTarget, { reliable: true });
    bindDataConnection(conn);
    conn.on('open', () => {
      setTimeout(() => {
        try {
          conn.send(payload);
          appendChatMessage('我 -> ' + targetCode, uiPayload, true);
          if (payload.type === 'image') setStatus('图片已发送给 ' + targetCode);
        } catch (e) {
          setStatus('发送失败，请重试');
        }
      }, 150);
    });
    conn.on('error', () => {
      setStatus('无法连接到对方，对方可能不在线');
    });
  } catch (e) {
    setStatus('发送失败：' + (e.message || e));
  }
}

function sendChatMessage() {
  if (!peer || !online) return setStatus('请先上线后再发送消息');
  const text = $('chatInput').value.trim();
  if (!text) return;

  const targetCode = getActiveTargetCode();
  if (!validCode(targetCode)) return setStatus('请先填写对方的号码（3～20 位字母或数字）');
  const fullTarget = PREFIX + targetCode;
  if (fullTarget === peer.id) return setStatus('不能给自己发消息');

  store.set('peerCode', targetCode);
  $('chatInput').value = '';
  dispatchPayload(targetCode, fullTarget, { type: 'chat', text }, { kind: 'text', text });
}

async function handleImageSelected(file) {
  if (!file) return;
  if (!peer || !online) {
    setStatus('请先上线后再发送图片');
    return;
  }
  const targetCode = getActiveTargetCode();
  if (!validCode(targetCode)) {
    setStatus('请先填写对方的号码（3～20 位字母或数字）');
    return;
  }
  const fullTarget = PREFIX + targetCode;
  if (fullTarget === peer.id) {
    setStatus('不能给自己发图片');
    return;
  }

  store.set('peerCode', targetCode);
  setStatus('正在处理图片…');
  try {
    const compressed = await compressImageFile(file);
    const payload = { type: 'image', name: compressed.name, dataUrl: compressed.dataUrl };
    dispatchPayload(targetCode, fullTarget, payload, compressed);
  } catch (err) {
    setStatus(err.message || '图片发送失败');
  }
}

// ===== 上线（注册固定号码）=====
function goOnline() {
  const code = $('myCode').value.trim();
  if (!PeerCtor) return setStatus('通话库还没加载好，请稍等或检查网络');
  if (!validCode(code)) return setStatus('号码只能是 3～20 位字母或数字');
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  chatConns = {};
  online = false; render();
  store.set('myCode', code);
  setStatus('正在上线…');
  const p = new PeerCtor(PREFIX + code, PEER_OPTS);
  peer = p;
  p.on('open', () => {
    if (peer !== p) return;
    online = true; render();
    setStatus('已上线，号码 ' + code + '。可以拨打、发消息/图片，或等对方来电');
  });
  p.on('call', onIncoming);
  p.on('connection', (conn) => {
    if (peer !== p) return;
    bindDataConnection(conn);
  });
  p.on('disconnected', () => {
    if (peer !== p) return;
    online = false; render(); setStatus('与服务器断开，重连中…');
    if (!p.destroyed) { try { p.reconnect(); } catch (e) {} }
  });
  p.on('error', (err) => { if (peer === p) onPeerError(err); });
}

function onPeerError(err) {
  const t = err && err.type;
  if (t === 'peer-unavailable') {
    if (call && !$('remote').srcObject) cleanupCall('对方不在线（对方需要先打开本页面并上线）');
    else setStatus('对方不在线（对方需要先打开本页面并上线）');
    return;
  }
  if (t === 'unavailable-id') { online = false; render(); return setStatus('这个号码已被占用（可能别人在用，或你在另一个页面已上线），请换一个号码'); }
  if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(t)) {
    return setStatus('连不上信令服务器。公共服务器在你的网络下可能不可用，可改用手动呼叫码版，或自建 PeerServer');
  }
  setStatus('出错：' + (t || err));
}

// ===== 麦克风 / 摄像头 =====
async function getMedia(video) {
  const audio = { echoCancellation: true, noiseSuppression: true };
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio, video: video ? { facingMode: 'user' } : false });
  } catch (e) {
    if (video) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio, video: false });
        setStatus('摄像头不可用，已改为语音');
      } catch (e2) { setStatus('无法使用麦克风（' + e2.name + '）。请确认网址是 https 并已允许权限'); return false; }
    } else { setStatus('无法使用麦克风（' + e.name + '）。请确认网址是 https 并已允许权限'); return false; }
  }
  const hasVideo = localStream.getVideoTracks().length > 0;
  $('local').srcObject = localStream;
  $('local').hidden = !hasVideo;
  $('btnCam').hidden = !hasVideo;
  $('btnMute').textContent = '静音';
  $('btnCam').textContent = '关摄像头';
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  return true;
}

function stopMedia() {
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
  $('local').srcObject = null; $('remote').srcObject = null; $('tap').hidden = true;
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

function sendSignal(targetPeerId, payload) {
  if (!targetPeerId || !peer || peer.destroyed) return;
  const existing = chatConns[targetPeerId];
  if (existing && existing.open) {
    try { existing.send(payload); return; } catch (e) {}
  }
  try {
    const conn = peer.connect(targetPeerId, { reliable: true });
    bindDataConnection(conn);
    conn.on('open', () => {
      try { conn.send(payload); } catch (e) {}
    });
    conn.on('error', () => {});
  } catch (e) {}
}

// ===== 通话 =====
function attachCall(c) {
  let connected = false;

  c.on('stream', (rs) => {
    if (call !== c) return;
    const isFirstStream = !connected;
    connected = true;
    if (ringTimer) { clearTimeout(ringTimer); ringTimer = null; }
    const v = $('remote');
    if (v.srcObject !== rs) v.srcObject = rs;
    v.play().catch(() => { $('tap').hidden = false; });
    if (isFirstStream) startDurationTimer();
  });

  c.on('close', () => {
    if (call !== c) return;
    cleanupCall(connected ? '通话已结束' : '对方已结束或拒绝了来电');
  });

  c.on('error', (e) => {
    if (call !== c) return;
    cleanupCall((e && e.type) || String(e), true);
  });

  const pc = c.peerConnection;
  if (pc) {
    const onPcStateChange = () => {
      if (call !== c) return;
      const st = pc.connectionState;
      const ice = pc.iceConnectionState;
      if (st === 'closed' || st === 'failed' || ice === 'failed') {
        cleanupCall(connected ? '通话已断开' : '对方已拒绝来电或连接中断');
      }
    };
    pc.addEventListener('connectionstatechange', onPcStateChange);
    pc.addEventListener('iceconnectionstatechange', onPcStateChange);
  }
}

async function dial(video) {
  if (!peer || !online) return setStatus('请先上线');
  if (call || incoming) return;
  const target = $('peerCode').value.trim();
  if (!validCode(target)) return setStatus('请输入对方的号码（3～20 位字母或数字）');
  if (PREFIX + target === peer.id) return setStatus('不能拨打自己');
  if (!(await getMedia(video))) return;

  store.set('peerCode', target);
  const fullTarget = PREFIX + target;

  closeCtrlConn();
  if (!chatConns[fullTarget] || !chatConns[fullTarget].open) {
    try {
      const conn = peer.connect(fullTarget, { reliable: true });
      ctrlConn = conn;
      bindDataConnection(conn);
    } catch (e) {}
  }

  const c = peer.call(fullTarget, localStream, {
    metadata: { video: localStream.getVideoTracks().length > 0 }
  });
  call = c;
  attachCall(c);
  render();
  setStatus('正在呼叫 ' + target + '…（对方需要在线并接听）');
  ringTimer = setTimeout(() => {
    if (call === c && !$('remote').srcObject) {
      sendSignal(fullTarget, { type: 'cancel' });
      cleanupCall('对方无应答');
    }
  }, RING_MS);
}

function onIncoming(c) {
  if (call || incoming) {
    sendSignal(c.peer, { type: 'busy' });
    try { c.close(); } catch (e) {}
    return;
  }
  incoming = c;
  const from = String(c.peer).replace(PREFIX, '');
  const video = !!(c.metadata && c.metadata.video);
  $('inText').textContent = '来电：' + from + (video ? '（视频）' : '（语音）');
  setStatus('有来电');
  render();

  const pc = c.peerConnection;
  if (pc) {
    const onInPcChange = () => {
      if (incoming !== c) return;
      if (pc.connectionState === 'closed' || pc.connectionState === 'failed' || pc.iceConnectionState === 'failed') {
        clearCallTimers();
        incoming = null;
        render();
        setStatus('对方已取消呼叫');
      }
    };
    pc.addEventListener('connectionstatechange', onInPcChange);
    pc.addEventListener('iceconnectionstatechange', onInPcChange);
  }

  clearTimeout(inTimer);
  inTimer = setTimeout(() => {
    if (incoming === c) {
      incoming = null;
      try { c.close(); } catch (e) {}
      render();
      setStatus('来电已过期');
    }
  }, RING_MS);
}

async function accept() {
  const c = incoming;
  if (!c) return;
  const video = !!(c.metadata && c.metadata.video);
  if (!(await getMedia(video))) return reject();
  clearTimeout(inTimer);
  incoming = null;
  call = c;
  attachCall(c);
  c.answer(localStream);
  render();
  setStatus('正在连接…');
}

function reject() {
  clearTimeout(inTimer);
  const c = incoming;
  incoming = null;
  if (c) {
    sendSignal(c.peer, { type: 'reject' });
    try { c.close(); } catch (e) {}
  }
  stopMedia(); render();
  setStatus('已拒绝来电');
}

function hangup(msg) {
  const c = call;
  if (c && !$('remote').srcObject && c.peer) {
    sendSignal(c.peer, { type: 'cancel' });
  }
  cleanupCall(msg || '已挂断', false);
}

// ===== 按钮与事件 =====
$('btnOnline').onclick = goOnline;
$('btnVoice').onclick = () => dial(false);
$('btnVideo').onclick = () => dial(true);
$('btnAccept').onclick = accept;
$('btnReject').onclick = reject;
$('btnHang').onclick = () => hangup();
$('btnSend').onclick = sendChatMessage;
$('btnImg').onclick = () => { $('imgPicker').value = ''; $('imgPicker').click(); };
$('imgPicker').onchange = (e) => {
  const f = e.target && e.target.files && e.target.files[0];
  handleImageSelected(f);
};
$('imgModal').onclick = closeImagePreview;
$('chatInput').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    sendChatMessage();
  }
};
$('btnClearChat').onclick = () => { $('chatBox').innerHTML = ''; };
$('tap').onclick = () => { $('remote').play(); $('tap').hidden = true; };
$('btnMute').onclick = () => {
  const t = localStream && localStream.getAudioTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $('btnMute').textContent = t.enabled ? '静音' : '取消静音';
};
$('btnCam').onclick = () => {
  const t = localStream && localStream.getVideoTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  $('btnCam').textContent = t.enabled ? '关摄像头' : '开摄像头';
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && peer && !peer.destroyed && peer.disconnected) { try { peer.reconnect(); } catch (e) {} }
});

// ===== 启动 =====
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });
}
(async function boot() {
  const firstRun = !store.get('myCode');
  if (firstRun) store.set('myCode', String(Math.floor(100000 + Math.random() * 900000)));
  $('myCode').value = store.get('myCode');
  $('peerCode').value = store.get('peerCode');
  render();
  for (const url of PEERJS_URLS) {
    try { await loadScript(url); } catch (e) { continue; }
    PeerCtor = window.Peer || (window.peerjs && window.peerjs.Peer);
    if (PeerCtor) break;
  }
  if (!PeerCtor) return setStatus('通话库加载失败，请检查网络后刷新页面');
  await loadTurnCredentials();
  if (firstRun) setStatus('这是为你生成的固定号码，也可以改成好记的；点“上线”后把号码告诉对方');
  else goOnline();
})();
</script>
